<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Toss Design Preview</title>
  <style>
    /* Toss Design System Tokens (Approximate CSS) */
    :root {
      --tds-brand-blue: #3182F6;
      --tds-grey-900: #191F28;
      --tds-grey-700: #4E5968;
      --tds-grey-400: #B0B8C1;
      --tds-grey-200: #E5E8EB;
      --tds-grey-100: #F2F4F6;
      --tds-white: #FFFFFF;
      --tds-warning: #FFB300;
      
      --tds-radius-m: 12px;
      --tds-radius-xl: 16px;
      --tds-radius-full: 999px;
      
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--tds-white);
      color: var(--tds-grey-900);
      -webkit-font-smoothing: antialiased;
    }

    /* Mobile Frame Wrapper for Desktop Preview */
    .mobile-frame {
      max-width: 400px;
      height: 800px;
      margin: 20px auto;
      border: 1px solid var(--tds-grey-200);
      border-radius: 30px;
      overflow: hidden;
      position: relative;
      background: var(--tds-white);
      box-shadow: 0 12px 32px rgba(0,0,0,0.1);
    }

    /* TopBar Component */
    .top-bar {
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 17px;
      font-weight: 600;
      border-bottom: 1px solid transparent;
    }
    .back-btn {
      width: 24px;
      height: 24px;
      margin-right: 16px;
      color: var(--tds-grey-900);
      font-weight: bold;
    }

    /* Hero Section */
    .hero-section {
      padding: 24px 24px;
    }
    .title-1 { font-size: 18px; font-weight: 600; margin: 0 0 8px 0; color: var(--tds-grey-700); }
    .display-1 { font-size: 40px; font-weight: 700; margin: 0 0 8px 0; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .body-2 { font-size: 15px; font-weight: 400; line-height: 1.5; margin: 0; }
    .text-brand { color: var(--tds-brand-blue); font-weight: 600; }

    /* Divider */
    .divider { height: 12px; background-color: var(--tds-grey-100); }

    /* Section Container */
    .section { padding: 24px; }
    .title-2 { font-size: 20px; font-weight: 700; margin: 0 0 16px 0; }

    /* ListRow Component */
    .list-row {
      display: flex;
      align-items: center;
      padding: 8px 0;
    }
    .list-left {
      width: 44px;
      height: 44px;
      border-radius: var(--tds-radius-m);
      background: #FFF8E6; /* washed warning */
      color: var(--tds-warning);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      margin-right: 16px;
    }
    .list-body { flex: 1; }
    .list-title { font-size: 17px; font-weight: 600; margin: 0 0 4px 0; }
    .list-subtitle { font-size: 13px; color: var(--tds-grey-700); margin: 0; }

    /* Card Component */
    .card {
      background: var(--tds-grey-100);
      border-radius: var(--tds-radius-xl);
      padding: 20px;
    }
    .card .body-2 { color: var(--tds-grey-900); font-size: 15px; }

    /* BottomCTA Component */
    .bottom-cta-wrapper {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px 32px 20px;
      background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 20%);
    }
    .bottom-cta {
      background: var(--tds-brand-blue);
      color: var(--tds-white);
      height: 56px;
      border-radius: var(--tds-radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 700;
      width: 100%;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <!-- TopBar -->
  <div class="top-bar">
    <div class="back-btn">←</div>
    테슬라 (TSLA)
  </div>

  <!-- Hero Section -->
  <div class="hero-section">
    <h2 class="title-1">현재가</h2>
    <div class="display-1">$250.00</div>
    <p class="body-2 text-brand">+2.50 (+1.01%)</p>
  </div>

  <div class="divider"></div>

  <!-- Investment Opinion -->
  <div class="section">
    <h3 class="title-2">AI 애널리스트 의견</h3>
    <div class="list-row">
      <div class="list-left">HOLD</div>
      <div class="list-body">
        <h4 class="list-title">단기 보유를 권장해요</h4>
        <p class="list-subtitle">최근 변동성이 커지고 있어요.</p>
      </div>
    </div>
  </div>

  <!-- Key Points -->
  <div class="section">
    <h3 class="title-2">주요 포인트</h3>
    <div class="card">
      <p class="body-2">
        1. 3분기 실적이 기대치를 약간 하회했어요.<br><br>
        2. 사이버트럭 양산 이슈가 리스크로 작용할 수 있어요.<br><br>
        3. 장기적인 관점에서는 긍정적인 모멘텀이 있어요.
      </p>
    </div>
  </div>

  <!-- Bottom CTA -->
  <div class="bottom-cta-wrapper">
    <button class="bottom-cta">매수하기</button>
  </div>
</div>

</body>
</html>
